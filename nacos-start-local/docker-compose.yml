services:
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: nacos-standalone
    networks:
      - nacos-network
    environment:
      - MODE=standalone
      - TIME_ZONE=${NACOS_TIME_ZONE:-Asia/Shanghai}
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5}
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - NACOS_AUTH_USERNAME=nacos
      - NACOS_AUTH_PASSWORD=nacos
      - JVM_XMS=${NACOS_JVM_XMS:-512m}
      - JVM_XMX=${NACOS_JVM_XMX:-512m}
      - JVM_XMN=${NACOS_JVM_XMN:-256m}
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - nacos-data:/home/nacos/data
    ports:
      - "8840:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "9850:9850"

networks:
  nacos-network:
    driver: bridge

volumes:
  nacos-data:
    name: nacos-start-local-data
