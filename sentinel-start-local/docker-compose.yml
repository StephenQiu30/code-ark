services:
  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: sentinel-standalone
    networks:
      - sentinel-network
    environment:
      - TZ=${TZ}
      - JAVA_OPTS=-Xms128m -Xmx128m -Dserver.port=${SENTINEL_DASHBOARD_PORT} -Dcsp.sentinel.dashboard.server=localhost:${SENTINEL_DASHBOARD_PORT} -Dproject.name=sentinel-dashboard -Dcsp.sentinel.api.port=${SENTINEL_API_PORT}
    volumes:
      - ./sentinel/logs:/root/logs/csp
      - ./sentinel/data:/tmp/sentinel-log
    ports:
      - "${SENTINEL_DASHBOARD_PORT}:${SENTINEL_DASHBOARD_PORT}"
      - "${SENTINEL_API_PORT}:${SENTINEL_API_PORT}"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  sentinel-network:
    driver: bridge
