services:
  elasticsearch:
    image: elastic-start-local-elasticsearch:${ES_LOCAL_VERSION}-${IK_VERSION}
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
      args:
      - ES_VERSION=${ES_LOCAL_VERSION}
      - IK_VERSION=${IK_VERSION}
    container_name: ${ES_LOCAL_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: ${ES_LOCAL_MEM_LIMIT:-2g}
    mem_reservation: ${ES_LOCAL_MEM_RESERVATION:-1g}
    volumes:
    - dev-elasticsearch:/usr/share/elasticsearch/data
    ports:
    - 127.0.0.1:${ES_LOCAL_PORT}:9200
    extra_hosts:
    - host.docker.internal:host-gateway
    - model-runner.docker.internal:host-gateway
    environment:
    - discovery.type=single-node
    - ELASTIC_PASSWORD=${ES_LOCAL_PASSWORD}
    - xpack.security.enabled=true
    - xpack.security.http.ssl.enabled=false
    - xpack.license.self_generated.type=basic
    - xpack.ml.use_auto_machine_memory_percent=true
    - ES_JAVA_OPTS=${ES_LOCAL_JAVA_OPTS}
    - cluster.routing.allocation.disk.watermark.low=${ES_LOCAL_DISK_SPACE_REQUIRED}
    - cluster.routing.allocation.disk.watermark.high=${ES_LOCAL_DISK_SPACE_REQUIRED}
    - cluster.routing.allocation.disk.watermark.flood_stage=${ES_LOCAL_DISK_SPACE_REQUIRED}
    - _JAVA_OPTIONS=-XX:UseSVE=0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent --user "elastic:$${ELASTIC_PASSWORD}" "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        --output /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
  kibana_settings:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_LOCAL_VERSION}
    container_name: ${KIBANA_LOCAL_SETTINGS_CONTAINER_NAME}
    mem_limit: ${KIBANA_SETTINGS_MEM_LIMIT:-256m}
    command: "bash -c '\n  echo \"Renewing Elasticsearch trial license...\";\n  curl\
      \ -s -u \"elastic:${ES_LOCAL_PASSWORD}\" -X POST \"http://elasticsearch:9200/_license/start_trial?acknowledge=true\"\
      \ && echo \"License renewed successfully\" || echo \"License renewal failed\
      \ (may already be active)\";\n\n  echo \"Setup the kibana_system password\"\
      ;\n  start_time=$$(date +%s);\n  timeout=60;\n  until curl -s -u \"elastic:${ES_LOCAL_PASSWORD}\"\
      \ -X POST http://elasticsearch:9200/_security/user/kibana_system/_password -d\
      \ \"{\\\"password\\\":\\\"${KIBANA_LOCAL_PASSWORD}\\\"}\" -H \"Content-Type:\
      \ application/json\" | grep -q \"^{}\"; do\n    if [ $$(($$(date +%s) - $$start_time))\
      \ -ge $$timeout ]; then\n      echo \"Error: Elasticsearch timeout\";\n    \
      \  exit 1;\n    fi;\n    sleep 2;\n  done;\n  echo \"Kibana setup completed\
      \ successfully\";\n'\n"
  kibana:
    depends_on:
      kibana_settings:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${ES_LOCAL_VERSION}
    container_name: ${KIBANA_LOCAL_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: ${KIBANA_LOCAL_MEM_LIMIT:-1536m}
    mem_reservation: ${KIBANA_LOCAL_MEM_RESERVATION:-768m}
    volumes:
    - dev-kibana:/usr/share/kibana/data
    - ./config/telemetry.yml:/usr/share/kibana/config/telemetry.yml
    ports:
    - 127.0.0.1:${KIBANA_LOCAL_PORT}:5601
    extra_hosts:
    - host.docker.internal:host-gateway
    - model-runner.docker.internal:host-gateway
    environment:
    - SERVER_NAME=kibana
    - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    - ELASTICSEARCH_USERNAME=kibana_system
    - ELASTICSEARCH_PASSWORD=${KIBANA_LOCAL_PASSWORD}
    - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    - ELASTICSEARCH_PUBLICBASEURL=http://localhost:${ES_LOCAL_PORT}
    - XPACK_SPACES_DEFAULTSOLUTION=es
    - NODE_OPTIONS=${KIBANA_LOCAL_NODE_OPTIONS:---max-old-space-size=768}
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent http://localhost:5601/api/status --output /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
  logstash:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_LOCAL_VERSION}
    container_name: ${LOGSTASH_LOCAL_CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: ${LOGSTASH_LOCAL_MEM_LIMIT:-1g}
    mem_reservation: ${LOGSTASH_LOCAL_MEM_RESERVATION:-512m}
    volumes:
    - dev-logstash:/usr/share/logstash/data
    - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
    - ./config/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    ports:
    - 127.0.0.1:${LOGSTASH_LOCAL_PORT}:5044
    - 127.0.0.1:5000:5000/tcp
    - 127.0.0.1:5000:5000/udp
    - 127.0.0.1:9600:9600
    extra_hosts:
    - host.docker.internal:host-gateway
    - model-runner.docker.internal:host-gateway
    environment:
    - ELASTIC_USER=elastic
    - ELASTIC_PASSWORD=${ES_LOCAL_PASSWORD}
    - ELASTIC_HOSTS=http://elasticsearch:9200
    - XPACK_MONITORING_ENABLED=true
    - XPACK_MONITORING_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    - XPACK_MONITORING_ELASTICSEARCH_USERNAME=elastic
    - XPACK_MONITORING_ELASTICSEARCH_PASSWORD=${ES_LOCAL_PASSWORD}
    - LS_JAVA_OPTS=${LOGSTASH_LOCAL_JAVA_OPTS}
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent http://localhost:9600/_node/stats/pipelines/lucky-logs
        | grep -Eq '"events"[[:space:]]*:[[:space:]]*\{'
      interval: 10s
      timeout: 10s
      retries: 30
    env_file:
    - path: C:/Users/Administrator/.lucky/lucky-local/observability/config/logstash.env
      format: raw
    networks:
    - default
    - lucky-kafka
volumes:
  dev-elasticsearch: null
  dev-elasticsearch-plugins: null
  dev-kibana: null
  dev-logstash: null
networks:
  lucky-kafka:
    external: true
    name: kafka-start-local_default
