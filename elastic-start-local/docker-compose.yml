services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_LOCAL_VERSION}
    container_name: ${ES_LOCAL_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - dev-elasticsearch:/usr/share/elasticsearch/data
      - dev-elasticsearch-plugins:/usr/share/elasticsearch/plugins
    # 首次启动自动安装 IK 分词器插件，已安装则跳过
    entrypoint: >
      bash -c '
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-ik ]; then
          echo "Installing IK Analysis plugin...";
          elasticsearch-plugin install --batch https://get.infini.cloud/elasticsearch/analysis-ik/${IK_VERSION};
        fi;
        /usr/local/bin/docker-entrypoint.sh eswrapper
      '
    ports:
      - 127.0.0.1:${ES_LOCAL_PORT}:9200
    extra_hosts:
      - host.docker.internal:host-gateway
      - model-runner.docker.internal:host-gateway
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ES_LOCAL_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=trial
      - xpack.ml.use_auto_machine_memory_percent=true
      - ES_JAVA_OPTS=${ES_LOCAL_JAVA_OPTS}
      - cluster.routing.allocation.disk.watermark.low=${ES_LOCAL_DISK_SPACE_REQUIRED}
      - cluster.routing.allocation.disk.watermark.high=${ES_LOCAL_DISK_SPACE_REQUIRED}
      - cluster.routing.allocation.disk.watermark.flood_stage=${ES_LOCAL_DISK_SPACE_REQUIRED}
      - "_JAVA_OPTIONS=-XX:UseSVE=0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl --output /dev/null --silent --head --fail -u elastic:${ES_LOCAL_PASSWORD} http://elasticsearch:9200" ]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana_settings:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_LOCAL_VERSION}
    container_name: ${KIBANA_LOCAL_SETTINGS_CONTAINER_NAME}
    restart: 'no'
    command: >
      bash -c '
        echo "Setup the kibana_system password";
        start_time=$$(date +%s);
        timeout=60;
        until curl -s -u "elastic:${ES_LOCAL_PASSWORD}" -X POST http://elasticsearch:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_LOCAL_PASSWORD}\"}" -H "Content-Type: application/json" | grep -q "^{}"; do
          if [ $$(($$(date +%s) - $$start_time)) -ge $$timeout ]; then
            echo "Error: Elasticsearch timeout";
            exit 1;
          fi;
          sleep 2;
        done;
      '

  kibana:
    depends_on:
      kibana_settings:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${ES_LOCAL_VERSION}
    container_name: ${KIBANA_LOCAL_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - dev-kibana:/usr/share/kibana/data
      - ./config/telemetry.yml:/usr/share/kibana/config/telemetry.yml
    ports:
      - 127.0.0.1:${KIBANA_LOCAL_PORT}:5601
    extra_hosts:
      - host.docker.internal:host-gateway
      - model-runner.docker.internal:host-gateway
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_LOCAL_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - ELASTICSEARCH_PUBLICBASEURL=http://localhost:${ES_LOCAL_PORT}
      - XPACK_SPACES_DEFAULTSOLUTION=es
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -I http://kibana:5601 | grep -q 'HTTP/1.1 302 Found'" ]
      interval: 10s
      timeout: 10s
      retries: 30

  logstash:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_LOCAL_VERSION}
    container_name: ${LOGSTASH_LOCAL_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - dev-logstash:/usr/share/logstash/data
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./config/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    ports:
      - 127.0.0.1:${LOGSTASH_LOCAL_PORT}:5044
      - 127.0.0.1:5000:5000/tcp
      - 127.0.0.1:5000:5000/udp
      - 127.0.0.1:9600:9600
    extra_hosts:
      - host.docker.internal:host-gateway
      - model-runner.docker.internal:host-gateway
    environment:
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ES_LOCAL_PASSWORD}
      - ELASTIC_HOSTS=http://elasticsearch:9200
      - XPACK_MONITORING_ENABLED=true
      - XPACK_MONITORING_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_MONITORING_ELASTICSEARCH_USERNAME=elastic
      - XPACK_MONITORING_ELASTICSEARCH_PASSWORD=${ES_LOCAL_PASSWORD}
      - LS_JAVA_OPTS=${LOGSTASH_LOCAL_JAVA_OPTS}
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -I http://logstash:9600 | grep -q 'HTTP/1.1 200 OK'" ]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  dev-elasticsearch:
  dev-elasticsearch-plugins:
  dev-kibana:
  dev-logstash:
