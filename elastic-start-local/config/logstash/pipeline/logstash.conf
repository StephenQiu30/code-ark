input {
  # Beats 输入 (用于 Filebeat 等)
  beats {
    port => 5044
  }

  # HTTP 输入
  http {
    port => 8080
    codec => json
  }

  # TCP 输入
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 示例：解析 JSON 日志
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # 示例：添加时间戳
  if ![@timestamp] {
    ruby {
      code => "event.set('@timestamp', Time.now)"
    }
  }

  # 示例：根据日志级别添加标签
  if [level] {
    mutate {
      add_field => { "log_level" => "%{level}" }
    }
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    index => "logstash-%{+YYYY.MM.dd}"
    ecs_compatibility => "v8"
  }

  # 可选：输出到标准输出用于调试
  stdout {
    codec => rubydebug
  }
}