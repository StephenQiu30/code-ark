input {
  kafka {
    bootstrap_servers => "${LUCKY_LOG_KAFKA_BROKER}"
    topics => ["${LUCKY_LOG_KAFKA_TOPIC}"]
    group_id => "${LUCKY_LOG_KAFKA_GROUP}"
    client_id => "${LUCKY_LOG_KAFKA_CLIENT}"
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    max_poll_records => "${LUCKY_LOG_KAFKA_MAX_POLL}"
    consumer_threads => "${LUCKY_LOG_KAFKA_THREADS}"
    decorate_events => "basic"
    codec => json { target => "[lucky]" }
  }
}
filter {
  ruby { path => "/usr/share/logstash/pipeline/lucky-normalize.rb" }
  if [eventTime] {
    date { match => ["eventTime", "ISO8601"] target => "@timestamp" }
    mutate { remove_field => ["eventTime"] }
  }
  if "_dateparsefailure" in [tags] {
    mutate {
      replace => { "[event][kind]" => "pipeline_error" }
      add_field => { "[error][code]" => "invalid_timestamp" }
    }
  }
}
output {
  if [event][kind] == "pipeline_error" {
    elasticsearch {
      hosts => ["${LUCKY_ELASTIC_HOSTS}"]
      user => "${LUCKY_ELASTIC_USER}"
      password => "${LUCKY_ELASTIC_PASSWORD}"
      index => "lucky-logs-invalid-%{+YYYY.MM.dd}"
      document_id => "%{[event][id]}"
      action => "index"
      ilm_enabled => false
      manage_template => false
    }
  } else {
    elasticsearch {
      hosts => ["${LUCKY_ELASTIC_HOSTS}"]
      user => "${LUCKY_ELASTIC_USER}"
      password => "${LUCKY_ELASTIC_PASSWORD}"
      index => "lucky-logs-application-%{+YYYY.MM.dd}"
      document_id => "%{[event][id]}"
      action => "index"
      ilm_enabled => false
      manage_template => false
    }
  }
}
