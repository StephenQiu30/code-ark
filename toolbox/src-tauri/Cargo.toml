[package]
name = "codeark-toolbox"
version = "0.1.0"
description = "Code Ark local infrastructure toolbox"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/StephenQiu30/code-ark"
default-run = "codeark-toolbox"

[lib]
name = "codeark_toolbox"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codeark-toolbox"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
getrandom = "=0.4.3"
sha2 = "0.10"
base64 = "0.22"
zeroize = "=1.9.1"
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["serialize", "deserialize"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "fs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "form", "query", "stream", "rustls"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "mysql-rsa"] }
sysinfo = { version = "=0.40.3", default-features = false, features = ["system", "disk"] }
dirs = "=7.0.0"
libc = "=0.2.191"
tar = "0.4"
quick-xml = "=0.42.0"
tauri = { version = "=2.12.5", optional = true }

tauri-plugin-dialog = { version = "=2.8.4", optional = true }
tauri-plugin-opener = { version = "=2.7.3", optional = true }

[dev-dependencies]
tempfile = "3"
