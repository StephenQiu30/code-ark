[package]
name = "codeark-toolbox"
version = "0.1.0"
description = "Code Ark local infrastructure toolbox"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/StephenQiu30/code-ark"
default-run = "codeark-toolbox"

[lib]
name = "codeark_toolbox"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codeark-toolbox"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
getrandom = "=0.4.3"
sha2 = "0.10"
base64 = "0.22"
zeroize = "=1.9.1"
serde-saphyr = "=2.1.1"
tauri = { version = "=2.12.5", optional = true }

[dev-dependencies]
tempfile = "3"
