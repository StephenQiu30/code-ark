services:
  # XXL-Job Admin 调度中心
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: xxl-job-admin
    ports:
      - "18081:8080"
    environment:
      # 数据库配置
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${MYSQL_USERNAME}
        --spring.datasource.password=${MYSQL_PASSWORD}
        --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN}
        --server.port=8080
      TZ: Asia/Shanghai
      # JVM 内存配置
      JAVA_OPTS: >-
        -Xms256m
        -Xmx256m
        -XX:MaxMetaspaceSize=128m
    volumes:
      - ./logs/xxl-job:/data/applogs
    networks:
      - xxl-job-network
    # healthcheck: 该镜像不包含 curl，暂时禁用健康检查
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/xxl-job-admin/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  xxl-job-network:
    driver: bridge
