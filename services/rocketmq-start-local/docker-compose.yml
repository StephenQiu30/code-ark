services:
  # NameServer - RocketMQ 的服务注册发现中心
  namesrv:
    image: apache/rocketmq:5.5.0
    container_name: rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "127.0.0.1:15876:9876"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m
    command: sh mqnamesrv
    networks:
      - rocketmq-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Broker - RocketMQ 消息代理
  broker:
    image: apache/rocketmq:5.5.0
    container_name: rocketmq-broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:15909:10909"
      - "127.0.0.1:15911:10911"
      - "127.0.0.1:15912:10912"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - NAMESRV_ADDR=namesrv:9876
      - JAVA_OPT_EXT=-Xms512m -Xmx512m
    command: sh -c "sleep 15 && sh mqbroker -c /home/rocketmq/conf/broker.conf"
    depends_on:
      - namesrv
    volumes:
      - ./data/broker/logs:/home/rocketmq/logs
      - ./data/broker/store:/home/rocketmq/store
      - ./conf/broker.conf:/home/rocketmq/conf/broker.conf
    networks:
      - rocketmq-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Console - RocketMQ 可视化管理控制台
  console:
    image: styletang/rocketmq-console-ng:latest
    container_name: rocketmq-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:18180:8080"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - JAVA_OPTS=-Xms128m -Xmx128m -Drocketmq.namesrv.addr=namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    depends_on:
      - namesrv
      - broker
    networks:
      - rocketmq-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  rocketmq-network:
    driver: bridge
