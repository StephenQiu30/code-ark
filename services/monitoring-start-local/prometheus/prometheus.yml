# Prometheus 配置文件

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'monitoring-local'
    environment: 'dev'

# 告警规则文件
rule_files:
  - 'rules/*.yml'

# 采集目标配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # 其他采集目标按需启用。当前 Compose 只启动 Prometheus 与 Grafana，
  # 未部署的 exporter 不写入配置，避免出现永久 down 的目标。
  #
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #
  # - job_name: 'rocketmq'
  #   static_configs:
  #     - targets: ['rocketmq-exporter:5557']
  #
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
