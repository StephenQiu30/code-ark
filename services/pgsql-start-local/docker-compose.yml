services:
  postgres:
    image: postgres:18.6
    container_name: pgsql-start-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_DB: ${PGSQL_DATABASE}
      POSTGRES_USER: ${PGSQL_USER}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./pgsql-data:/var/lib/postgresql
      - ./pgsql-init:/docker-entrypoint-initdb.d:ro
    command:
      - -c
      - max_connections=200
      - -c
      - shared_buffers=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_USER} -d ${PGSQL_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
